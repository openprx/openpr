# A WebSocket handshake only survives the proxy if `Upgrade` and `Connection` are
# forwarded, and `Connection` has to stay `close` for the ordinary requests sharing
# this location -- hardcoding `upgrade` would break every REST call.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200m;
    # Written at container start from /etc/resolv.conf; see docker-entrypoint.d/10-resolver.sh.
    include /etc/nginx/conf.d/resolver.conf;
    set $api_upstream api:8080;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SvelteKit routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location ^~ /api {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # A synced document holds its socket open; the default 60s read timeout would
        # drop it on the first quiet minute.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Uploaded static files
    location ^~ /api/v1/uploads/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backward compatible uploads path
    location ^~ /uploads/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No MCP proxy here on purpose. The browser never calls the MCP server: the
    # frontend only renders its URL as connector configuration that the worker
    # dials server-side. Publishing /mcp on this origin would hand every visitor
    # the server's bot identity, since inbound MCP auth is a single shared token.
    # MCP clients connect to the mcp-server port directly.

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
