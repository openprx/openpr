# A WebSocket handshake only survives the proxy if `Upgrade` and `Connection` are
# forwarded, and `Connection` has to stay `close` for the ordinary requests sharing
# this location -- hardcoding `upgrade` would break every REST call.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Two OpenPR URLs carry a bearer credential in their query string: the one-time
# collab ticket on `GET /api/v1/collab/ws?ticket=...` (`ADR-0007`) and the HMAC on
# the signed attachment/upload download URLs (`?expires=...&signature=...`). The
# stock `main` log_format logs `$request`, which is the full request line including
# that query -- so the access log, the one artefact most likely to be retained and
# shipped off the box, ends up holding replayable credentials.
# apps/api/src/routes/collab.rs::trace_span already strips the query off the ticket
# route in the API's own spans; this proxy hop must not write it back.
#
# The redaction is deliberately blunt: if the query contains either parameter at
# all, the whole query is replaced. A regex that tried to excise just the one
# parameter and rebuild the rest would fail open on any shape it did not anticipate,
# and a log-redaction rule that fails open is worse than one that logs less.
map $args $loggable_args {
    ~*(^|&)(ticket|signature)=  "redacted";
    default                     $args;
}

log_format openpr_redacted '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri$is_args$loggable_args $server_protocol" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                           '"$http_x_forwarded_for"';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200m;
    # Written at container start from /etc/resolv.conf; see docker-entrypoint.d/10-resolver.sh.
    include /etc/nginx/conf.d/resolver.conf;

    # Overrides the image's http-level `access_log ... main;` for this server, so
    # every location below (including the signed /uploads paths) logs through the
    # credential-redacting format above. `location /health` keeps its own
    # `access_log off`.
    access_log /var/log/nginx/access.log openpr_redacted;
    set $api_upstream api:8080;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SvelteKit routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location ^~ /api {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # A synced document holds its socket open; the default 60s read timeout would
        # drop it on the first quiet minute.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Uploaded static files
    location ^~ /api/v1/uploads/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backward compatible uploads path
    location ^~ /uploads/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No MCP proxy here on purpose. The browser never calls the MCP server: the
    # frontend only renders its URL as connector configuration that the worker
    # dials server-side. Publishing /mcp on this origin would hand every visitor
    # the server's bot identity, since inbound MCP auth is a single shared token.
    # MCP clients connect to the mcp-server port directly.

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
