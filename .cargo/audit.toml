[advisories]
# Lockfile-only through SQLx's inactive MySQL backend; OpenPR enables only
# sqlx-postgres at build/runtime. Verified with cargo tree -i rsa/sqlx-mysql.
ignore = ["RUSTSEC-2023-0071"]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[database]
fetch = true
stale = false

[output]
deny = ["unmaintained"]
format = "terminal"
quiet = false
show_tree = true

[yanked]
enabled = true
update_index = true
