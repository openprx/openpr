[advisories]
# Lockfile-only through SQLx's inactive MySQL backend; OpenPR enables only
# sqlx-postgres at build/runtime. Verified with cargo tree -i rsa/sqlx-mysql.
ignore = [
    "RUSTSEC-2023-0071",
    # rkyv 0.7 out-of-bounds read when validating an untrusted archive. Reached only as
    # rust_decimal's optional rkyv backend by way of sea-orm; OpenPR never produces or parses
    # a rkyv archive (decimals cross every boundary as strings). Needs rust_decimal on
    # rkyv >=0.8.17 upstream before it can be resolved here.
    "RUSTSEC-2026-0235",
    # proc-macro-error2 unmaintained: build-time proc-macro only, never linked into the
    # shipped binaries. Pulled in transitively; waiting on its dependents to migrate.
    "RUSTSEC-2026-0173",
    # atomic-polyfill unmaintained: build-graph-only through wasmtime's Cranelift backend
    # (wasmtime -> cranelift-codegen -> postcard -> heapless). It emulates atomics on
    # single-core targets; OpenPR builds only targets with native atomics, so those paths are
    # never compiled in. Resolvable only when heapless 0.7 is dropped upstream.
    "RUSTSEC-2023-0089",
    # im / sized-chunks / bitmaps (via loro -> loro-internal) and smallstr (via yrs) are
    # unmaintained. All four are reachable ONLY from the Sylvode Flow v0.3 CRDT evaluation
    # spikes: cargo tree -p api|worker|mcp-server shows zero dependency on spikes/*, so none is
    # linked into any shipped binary. These are unmaintained advisories, not vulnerabilities.
    # ADR-0005 selects exactly one engine, after which the losing candidate's subtree leaves the
    # lockfile entirely, so this set shrinks rather than grows. Re-evaluate at that decision and
    # treat the surviving engine's unmaintained transitive deps as an input to the decision
    # itself rather than a permanent exemption.
    "RUSTSEC-2026-0247",
    "RUSTSEC-2026-0248",
    "RUSTSEC-2026-0251",
    "RUSTSEC-2026-0215",
]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[database]
fetch = true
stale = false

[output]
deny = ["unmaintained"]
format = "terminal"
quiet = false
show_tree = true

[yanked]
enabled = true
update_index = true
