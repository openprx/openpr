version: "3.9"

# The api, worker and mcp-server binaries read NO environment variables. Every setting they use
# comes from a TOML configuration file, mounted read-only at /app/config/openpr.toml and named
# explicitly with --config. `scripts/start.sh` generates both files; `config/openpr.example.toml`
# is the annotated reference.
#
# Two files rather than one. api and worker are a single trust domain: same database, same signing
# key, and a split file could let the two drift apart. The MCP server is the agent facing surface
# that is published on a port, and it needs neither the database URL nor the JWT signing key --
# it reaches the API over HTTP with a workspace bot token. Handing it the signing key would turn a
# compromise of that surface into the ability to forge any user's token, so it gets a file that
# carries only [logging] and [mcp]. The lazy validation of [database] and [auth] is what makes an
# MCP-only file a complete configuration.
#
# The environment blocks below are for images that are configured by environment (postgres), and
# the ${...} interpolations are docker-compose's own mechanism for ports, host binding and the
# runtime base image. Neither is application configuration.

services:
  postgres:
    image: postgres:16
    # The postgres image initialises itself from these; they are read by the image's entrypoint,
    # not by OpenPR. POSTGRES_PASSWORD must match the password inside database.url in
    # config/openpr.compose.toml.
    environment:
      POSTGRES_DB: openpr
      POSTGRES_USER: openpr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for PostgreSQL}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpr -d openpr"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - openpr-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
      args:
        RUNTIME_BASE: ${OPENPR_RUNTIME_BASE:-debian:bookworm-slim}
        APP_BIN: api
    command: ["/app/api", "--config", "/app/config/openpr.toml"]
    ports:
      - "${OPENPR_BIND_HOST:-127.0.0.1}:${OPENPR_API_PORT:-8081}:8080"
    volumes:
      # Generated by scripts/start.sh. A missing source file makes the daemon create a directory
      # here and the container then fails to read its configuration, so start.sh checks for that.
      - ./config/openpr.compose.toml:/app/config/openpr.toml:ro
      # Must match `dir` under [storage] in that file.
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - openpr-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
      args:
        RUNTIME_BASE: ${OPENPR_RUNTIME_BASE:-debian:bookworm-slim}
        APP_BIN: worker
    command: ["/app/worker", "--config", "/app/config/openpr.toml"]
    volumes:
      # The same file the api reads: one database, one signing key, no drift between the two.
      - ./config/openpr.compose.toml:/app/config/openpr.toml:ro
      # The worker writes attachment package job artifacts through the same storage backend as the
      # api, so it needs the same directory behind [storage] dir.
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openpr-network

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
      args:
        RUNTIME_BASE: ${OPENPR_RUNTIME_BASE:-debian:bookworm-slim}
        APP_BIN: mcp-server
    # --transport and --bind-addr are stated here rather than left to the file: the container has
    # to bind 0.0.0.0 for the other services to reach it, and that requirement belongs to this
    # deployment, not to the file. A flag wins over the file, so the compose stack serves HTTP on
    # 8090 whatever [mcp] transport says.
    #
    # The inbound bearer token is NOT a flag: argv is readable by any local process through /proc.
    # It lives in mcp.auth_token in the mounted file, and the server refuses to start on a
    # non-loopback bind without it.
    command:
      - "/app/mcp-server"
      - "serve"
      - "--config"
      - "/app/config/openpr.toml"
      - "--transport"
      - "http"
      - "--bind-addr"
      - "0.0.0.0:8090"
    ports:
      - "${OPENPR_BIND_HOST:-127.0.0.1}:${MCP_SERVER_PORT:-8090}:8090"
    volumes:
      # Carries [logging] and [mcp] only -- no database URL and no signing key reach this service.
      - ./config/openpr.compose.mcp.toml:/app/config/openpr.toml:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - openpr-network

  frontend:
    build:
      context: ./frontend
      # Dockerfile builds from source; Dockerfile.prebuilt serves an existing
      # ./frontend/build, for hosts that have no bun toolchain.
      dockerfile: ${OPENPR_FRONTEND_DOCKERFILE:-Dockerfile}
    ports:
      - "${OPENPR_BIND_HOST:-127.0.0.1}:${OPENPR_FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - openpr-network

  webhook:
    profiles:
      - connectors
    image: ${OPENPR_WEBHOOK_IMAGE:-ghcr.io/openprx/openpr-webhook:latest}
    volumes:
      - ${OPENPR_WEBHOOK_CONFIG:-./config/openpr-webhook.example.toml}:/etc/openpr-webhook/config.toml:ro
    command: ["/app/openpr-webhook", "/etc/openpr-webhook/config.toml"]
    ports:
      - "${OPENPR_BIND_HOST:-127.0.0.1}:${OPENPR_WEBHOOK_PORT:-9090}:9090"
    networks:
      - openpr-network
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

networks:
  openpr-network:
    driver: bridge
