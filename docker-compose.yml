version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: openpr
      POSTGRES_USER: openpr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for PostgreSQL}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpr -d openpr"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - openpr-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
      args:
        APP_BIN: api
    command: ["/app/api"]
    environment:
      APP_NAME: api
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://openpr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for PostgreSQL}@postgres:5432/openpr
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET for OpenPR services}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-2592000}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      RUST_LOG: ${RUST_LOG:-info}
      UPLOAD_DIR: /app/uploads
      OPENPR_OBJECT_STORAGE_BACKEND: ${OPENPR_OBJECT_STORAGE_BACKEND:-local}
      OPENPR_OBJECT_STORAGE_DIR: ${OPENPR_OBJECT_STORAGE_DIR:-/app/uploads}
      OPENPR_OBJECT_STORAGE_S3_ENDPOINT: ${OPENPR_OBJECT_STORAGE_S3_ENDPOINT:-}
      OPENPR_OBJECT_STORAGE_S3_BUCKET: ${OPENPR_OBJECT_STORAGE_S3_BUCKET:-}
      OPENPR_OBJECT_STORAGE_S3_REGION: ${OPENPR_OBJECT_STORAGE_S3_REGION:-us-east-1}
      OPENPR_OBJECT_STORAGE_S3_ACCESS_KEY_ID: ${OPENPR_OBJECT_STORAGE_S3_ACCESS_KEY_ID:-}
      OPENPR_OBJECT_STORAGE_S3_SECRET_ACCESS_KEY: ${OPENPR_OBJECT_STORAGE_S3_SECRET_ACCESS_KEY:-}
      OPENPR_OBJECT_STORAGE_S3_SESSION_TOKEN: ${OPENPR_OBJECT_STORAGE_S3_SESSION_TOKEN:-}
      # Outbound delivery targets. Connector and webhook endpoints resolving to a private address
      # are refused unless the host is listed here; the defaults keep the in-compose services
      # (including the optional `webhook` connector receiver) reachable out of the box.
      OPENPR_OUTBOUND_ALLOWED_HOSTS: ${OPENPR_OUTBOUND_ALLOWED_HOSTS:-webhook:9090,api:8080,mcp-server:8090,frontend:80}
      OPENPR_OUTBOUND_ALLOW_PRIVATE: ${OPENPR_OUTBOUND_ALLOW_PRIVATE:-}
      # Connector credentials referenced as
      # `env:OPENPR_CONNECTOR_SECRET_W_<WORKSPACE_UUID_NO_DASHES_UPPERCASE>_<NAME>` in
      # `auth_policy`. The namespace binds a credential to one workspace: any user can create a
      # workspace and is its admin there, so a process wide name would be readable by every tenant.
      # Add one variable per connector secret; no other environment variable can be referenced.
      OPENPR_CONNECTOR_SECRET_W_00000000000000000000000000000000_DEFAULT: ${OPENPR_CONNECTOR_SECRET_W_00000000000000000000000000000000_DEFAULT:-}
    ports:
      - "${OPENPR_BIND_HOST:-127.0.0.1}:${OPENPR_API_PORT:-8081}:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - openpr-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
      args:
        APP_BIN: worker
    command: ["/app/worker"]
    environment:
      APP_NAME: worker
      DATABASE_URL: postgres://openpr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for PostgreSQL}@postgres:5432/openpr
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET for OpenPR services}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-2592000}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      RUST_LOG: ${RUST_LOG:-info}
      OPENPR_OBJECT_STORAGE_BACKEND: ${OPENPR_OBJECT_STORAGE_BACKEND:-local}
      OPENPR_OBJECT_STORAGE_DIR: ${OPENPR_OBJECT_STORAGE_DIR:-/app/uploads}
      OPENPR_OBJECT_STORAGE_S3_ENDPOINT: ${OPENPR_OBJECT_STORAGE_S3_ENDPOINT:-}
      OPENPR_OBJECT_STORAGE_S3_BUCKET: ${OPENPR_OBJECT_STORAGE_S3_BUCKET:-}
      OPENPR_OBJECT_STORAGE_S3_REGION: ${OPENPR_OBJECT_STORAGE_S3_REGION:-us-east-1}
      OPENPR_OBJECT_STORAGE_S3_ACCESS_KEY_ID: ${OPENPR_OBJECT_STORAGE_S3_ACCESS_KEY_ID:-}
      OPENPR_OBJECT_STORAGE_S3_SECRET_ACCESS_KEY: ${OPENPR_OBJECT_STORAGE_S3_SECRET_ACCESS_KEY:-}
      OPENPR_OBJECT_STORAGE_S3_SESSION_TOKEN: ${OPENPR_OBJECT_STORAGE_S3_SESSION_TOKEN:-}
      # Outbound delivery targets. Connector and webhook endpoints resolving to a private address
      # are refused unless the host is listed here; the defaults keep the in-compose services
      # (including the optional `webhook` connector receiver) reachable out of the box.
      OPENPR_OUTBOUND_ALLOWED_HOSTS: ${OPENPR_OUTBOUND_ALLOWED_HOSTS:-webhook:9090,api:8080,mcp-server:8090,frontend:80}
      OPENPR_OUTBOUND_ALLOW_PRIVATE: ${OPENPR_OUTBOUND_ALLOW_PRIVATE:-}
      # Connector credentials referenced as
      # `env:OPENPR_CONNECTOR_SECRET_W_<WORKSPACE_UUID_NO_DASHES_UPPERCASE>_<NAME>` in
      # `auth_policy`. The namespace binds a credential to one workspace: any user can create a
      # workspace and is its admin there, so a process wide name would be readable by every tenant.
      # Add one variable per connector secret; no other environment variable can be referenced.
      OPENPR_CONNECTOR_SECRET_W_00000000000000000000000000000000_DEFAULT: ${OPENPR_CONNECTOR_SECRET_W_00000000000000000000000000000000_DEFAULT:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openpr-network

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
      args:
        APP_BIN: mcp-server
    environment:
      APP_NAME: mcp-server
      RUST_LOG: ${RUST_LOG:-info}
      OPENPR_API_URL: http://api:8080
      OPENPR_BOT_TOKEN: ${OPENPR_BOT_TOKEN:?set OPENPR_BOT_TOKEN for the MCP server}
      OPENPR_WORKSPACE_ID: ${OPENPR_WORKSPACE_ID:?set OPENPR_WORKSPACE_ID for the MCP server}
    command: ["/app/mcp-server", "serve", "--transport", "http", "--bind-addr", "0.0.0.0:8090"]
    ports:
      - "${OPENPR_BIND_HOST:-127.0.0.1}:${MCP_SERVER_PORT:-8090}:8090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - openpr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${OPENPR_BIND_HOST:-127.0.0.1}:${OPENPR_FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - openpr-network

  webhook:
    profiles:
      - connectors
    image: ${OPENPR_WEBHOOK_IMAGE:-ghcr.io/openprx/openpr-webhook:latest}
    volumes:
      - ${OPENPR_WEBHOOK_CONFIG:-./config/openpr-webhook.example.toml}:/etc/openpr-webhook/config.toml:ro
    command: ["/app/openpr-webhook", "/etc/openpr-webhook/config.toml"]
    ports:
      - "${OPENPR_BIND_HOST:-127.0.0.1}:${OPENPR_WEBHOOK_PORT:-9090}:9090"
    networks:
      - openpr-network
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

networks:
  openpr-network:
    driver: bridge
