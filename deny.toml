# cargo-deny configuration — OpenPRX standard v2

[graph]
all-features = true
exclude-dev = false

[output]
feature-depth = 1

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "workspace"
ignore = [
    # Lockfile-only through SQLx's inactive MySQL backend. OpenPR enables only
    # sqlx-postgres at build/runtime; cargo tree -i rsa/sqlx-mysql prints no active tree.
    "RUSTSEC-2023-0071",

    # rkyv 0.7 out-of-bounds read when validating an untrusted archive containing Rc/Arc.
    # Reached only as rust_decimal's optional rkyv serialization backend, by way of sea-orm.
    # OpenPR never produces or parses a rkyv archive: decimals cross every boundary as
    # strings (the API rejects JSON numbers for amount fields outright), and no rkyv type
    # appears in the workspace. The fix needs rust_decimal to move to rkyv 0.8, so this
    # cannot be resolved here; revisit when sea-orm ships a rust_decimal with rkyv >=0.8.17.
    "RUSTSEC-2026-0235",

    # proc-macro-error2 is unmaintained. It is a build-time proc-macro dependency only, so
    # nothing from it is linked into the shipped binaries and it cannot be reached at
    # runtime. Pulled in transitively; no supported replacement is available to us until the
    # crates that depend on it migrate.
    "RUSTSEC-2026-0173",

    # atomic-polyfill is unmaintained. Build-graph-only through wasmtime's Cranelift backend
    # (wasmtime -> cranelift-codegen -> postcard -> heapless -> atomic-polyfill). It exists to
    # emulate atomics on single-core targets; OpenPR builds only for targets with native
    # atomics, so the polyfill paths are never compiled in. Resolvable only when heapless 0.7
    # is dropped upstream.
    "RUSTSEC-2023-0089",

    # im / sized-chunks / bitmaps and smallstr are unmaintained. All four are reachable ONLY
    # from the Sylvode Flow v0.3 CRDT evaluation spikes -- im/sized-chunks/bitmaps via
    # loro -> loro-internal, smallstr via yrs. `cargo tree -p api|worker|mcp-server` shows zero
    # dependency on spikes/*, so none of these is linked into any shipped binary; they are
    # reachable only when running the v0.3 benchmark/corpus harness locally.
    # These are "unmaintained" advisories, not vulnerabilities: no CVE, no known exploit path.
    # ADR-0005 selects exactly one engine, after which the losing candidate's subtree leaves the
    # lockfile entirely -- so this set shrinks rather than grows. Re-evaluate at that decision,
    # and treat the surviving engine's unmaintained transitive deps as a supply-chain input to
    # the decision itself rather than as a permanent exemption.
    "RUSTSEC-2026-0247",
    "RUSTSEC-2026-0248",
    "RUSTSEC-2026-0251",
    "RUSTSEC-2026-0215",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
include-dev = false
include-build = true
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
allow-workspace = true
highlight = "all"

deny = [
    { crate = "openssl", reason = "Use rustls-tls instead", use-instead = "rustls" },
    { crate = "openssl-sys", reason = "Use rustls-tls instead" },
]

[[bans.features]]
crate = "reqwest"
deny = ["native-tls", "native-tls-vendored"]

[bans.workspace-dependencies]
duplicates = "warn"
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
