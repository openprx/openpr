[workspace]
resolver = "2"
members = [
  "apps/api",
  "apps/worker",
  "apps/mcp-server",
  "crates/platform",
  "crates/collab-core",
  "spikes/collab-shared",
  "spikes/collab-loro",
  "spikes/collab-yrs-yjs",
]

[workspace.package]
authors = ["g1e2x87"]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.2.81"
description = "Open-source project management platform"
repository = "https://github.com/openprx/openpr"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.38", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
sea-orm = { version = "1", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-json",
  "with-time",
  "with-uuid",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
base64 = "0.22"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower = "0.5.2"
tower-http = { version = "0.6.4", features = ["trace", "cors", "compression-gzip", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.4", features = ["v4", "v5", "serde"] }
jsonwebtoken = "9"
parking_lot = "0.12"
bcrypt = "0.16"
wasmtime = "47"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"

inefficient_to_string = "deny"
large_futures = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_lossless = "warn"
too_many_lines = "allow"

# The isolated-apply worker enforces `decode_apply_cpu_ms_max`, a budget calibrated
# against production release builds. The whole metered window runs inside
# collab-core (decode, apply, semantic snapshot, shape validation), so an
# unoptimized build of this one crate makes a legitimate document exceed a
# production budget: at opt-level 0 the ceiling fires around 3,000 nodes, while
# release measures ~14ms for the full 10,000-node structural boundary. Optimize
# collab-core even in dev profiles so the metered work runs at production speed
# and the rest of the workspace stays debuggable.
[profile.dev.package.collab-core]
opt-level = 3

# Same reason, one level down: most of the metered window's real work happens
# inside Loro itself, so optimizing only collab-core moves the ceiling from
# ~3,000 to ~4,000 nodes and still rejects a legitimate 10,000-node document.
[profile.dev.package.loro]
opt-level = 3
[profile.dev.package.loro-internal]
opt-level = 3
[profile.dev.package.loro-common]
opt-level = 3
[profile.dev.package.loro-delta]
opt-level = 3
[profile.dev.package.loro-rle]
opt-level = 3
[profile.dev.package.loro-kv-store]
opt-level = 3
[profile.dev.package.loro_fractional_index]
opt-level = 3
[profile.dev.package.loro-thunderdome]
opt-level = 3
