name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-amd64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-arm64
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-amd64
            use_cross: false

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.use_cross }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The action adds the target to the stable toolchain, but rust-toolchain.toml
      # pins the channel, so cargo builds with a toolchain that action never touched.
      # Only a non-host native target notices: the host one ships with every toolchain.
      - name: Add target to the pinned toolchain
        if: "!matrix.use_cross"
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install system deps (Linux native)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build all binaries (cross)
        if: matrix.use_cross
        run: |
          cross build --release -p api --bin api --target ${{ matrix.target }}
          cross build --release -p worker --bin worker --target ${{ matrix.target }}
          cross build --release -p mcp-server --bin mcp-server --target ${{ matrix.target }}
          cross build --release -p mcp-server --bin sylvode --target ${{ matrix.target }}

      - name: Build all binaries (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          for bin in api worker mcp-server sylvode; do
            test -x target/${{ matrix.target }}/release/$bin
            cp target/${{ matrix.target }}/release/$bin staging/
            chmod +x staging/$bin
          done
          cd staging
          tar czf ../sylvode-${{ matrix.suffix }}.tar.gz *
          cd ..
          cp sylvode-${{ matrix.suffix }}.tar.gz openpr-${{ matrix.suffix }}.tar.gz
          sha256sum sylvode-${{ matrix.suffix }}.tar.gz > sylvode-${{ matrix.suffix }}.tar.gz.sha256
          sha256sum openpr-${{ matrix.suffix }}.tar.gz > openpr-${{ matrix.suffix }}.tar.gz.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging
          foreach ($bin in @("api", "worker", "mcp-server", "sylvode")) {
            $src = "target/${{ matrix.target }}/release/$bin.exe"
            if (-not (Test-Path $src)) { throw "missing release binary: $src" }
            Copy-Item $src staging/
          }
          Compress-Archive -Path staging/* -DestinationPath sylvode-${{ matrix.suffix }}.zip
          Copy-Item sylvode-${{ matrix.suffix }}.zip openpr-${{ matrix.suffix }}.zip
          Get-FileHash sylvode-${{ matrix.suffix }}.zip -Algorithm SHA256 | Format-List Hash | Out-File sylvode-${{ matrix.suffix }}.zip.sha256
          Get-FileHash openpr-${{ matrix.suffix }}.zip -Algorithm SHA256 | Format-List Hash | Out-File openpr-${{ matrix.suffix }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sylvode-${{ matrix.suffix }}
          path: |
            sylvode-${{ matrix.suffix }}.tar.gz
            sylvode-${{ matrix.suffix }}.tar.gz.sha256
            sylvode-${{ matrix.suffix }}.zip
            sylvode-${{ matrix.suffix }}.zip.sha256
            openpr-${{ matrix.suffix }}.tar.gz
            openpr-${{ matrix.suffix }}.tar.gz.sha256
            openpr-${{ matrix.suffix }}.zip
            openpr-${{ matrix.suffix }}.zip.sha256
          if-no-files-found: ignore

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        run: |
          cd frontend
          bun install
          bun run build
          tar czf ../sylvode-frontend.tar.gz build/ nginx.conf
          cp ../sylvode-frontend.tar.gz ../openpr-frontend.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sylvode-frontend
          path: |
            sylvode-frontend.tar.gz
            openpr-frontend.tar.gz

  release:
    needs: [build, build-frontend]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Sylvode ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: artifacts/*
          body: |
            ## Sylvode ${{ steps.tag.outputs.tag }}

            Pre-built binaries for Sylvode (API server, Worker, MCP server, native CLI, Frontend).

            ### Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x86_64 | `sylvode-linux-amd64.tar.gz` |
            | Linux | ARM64 | `sylvode-linux-arm64.tar.gz` |
            | macOS | Intel | `sylvode-macos-amd64.tar.gz` |
            | macOS | Apple Silicon | `sylvode-macos-arm64.tar.gz` |
            | Windows | x86_64 | `sylvode-windows-amd64.zip` |
            | Frontend | Static | `sylvode-frontend.tar.gz` |

            Each archive contains `api`, `worker`, legacy-compatible `mcp-server`, and
            the new `sylvode` CLI. Matching `openpr-*` archive names are retained as aliases.

            See [README.md](https://github.com/openprx/openpr) for setup instructions.
